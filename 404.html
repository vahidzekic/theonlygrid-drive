<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena · TOG Drive</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
  :root { --bg: #f7f9fc; --text: #17202b; --muted: #4f5b6b; --accent: #345b8c; --border: #d8dfe9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f141b; --text: #e6ebf2; --muted: #a5b0bf; --accent: #8db4e6; --border: #2b3645; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.6; padding: 24px 16px; }
  main { max-width: 520px; text-align: center; }
  svg { width: 64px; height: 64px; }
  h1 { font-size: 1.8rem; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  a { color: var(--accent); }
  .links { display: flex; gap: 12px 20px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#345b8c"/><path d="M10.2 22.5h11.6a4.6 4.6 0 0 0 .6-9.15 6.4 6.4 0 0 0-12.3 1.6 3.8 3.8 0 0 0 .1 7.55z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><rect x="13.3" y="16.2" width="5.4" height="4.4" rx="1" fill="#fff"/><path d="M14.4 16.3v-1.3a1.6 1.6 0 0 1 3.2 0v1.3" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
  <h1>Stranica nije pronađena</h1>
  <p>Adresa ne postoji ili je stranica premeštena.</p>
  <p lang="en">Page not found. The address does not exist or the page has moved.</p>
  <p lang="de">Seite nicht gefunden. Die Adresse existiert nicht oder die Seite wurde verschoben.</p>
  <div class="links">
    <!-- The site may live at /theonlygrid-drive/ (GitHub Pages) or at the root of a custom domain.
         The inline script points these links at the right base; without JavaScript they use the GitHub Pages path. -->
    <a class="home" data-path="" href="/theonlygrid-drive/">Početna</a>
    <a class="home" data-path="uputstvo.html" href="/theonlygrid-drive/uputstvo.html">Uputstvo</a>
    <a class="home" data-path="en/" href="/theonlygrid-drive/en/" lang="en">English</a>
    <a class="home" data-path="de/" href="/theonlygrid-drive/de/" lang="de">Deutsch</a>
  </div>
</main>
<script>
  (function () {
    var base = location.pathname.indexOf('/theonlygrid-drive/') === 0 ? '/theonlygrid-drive/' : '/';
    var links = document.querySelectorAll('a.home');
    for (var i = 0; i < links.length; i++) links[i].setAttribute('href', base + links[i].getAttribute('data-path'));
  })();
</script>
</body>
</html>
